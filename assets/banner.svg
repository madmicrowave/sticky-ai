<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Sticky-AI (Sticky-AI.app / SAI) — Open-Source Native macOS Menu Bar &amp; Floating Window Application for Google Gemini">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1d"/>
      <stop offset="50%" stop-color="#111833"/>
      <stop offset="100%" stop-color="#181236"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.93"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="22" fill="url(#bg)"/>
  <circle cx="980" cy="110" r="195" fill="#4285F4" opacity="0.14"/>
  <circle cx="880" cy="370" r="175" fill="#8b5cf6" opacity="0.14"/>

  <!-- Left Copy Column -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="420" height="32" rx="16" fill="#172036" stroke="#2d3c5e"/>
    <circle cx="18" cy="16" r="5" fill="#22c55e"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Native macOS Application (Sticky-AI.app) • Swift • MIT Open Source</text>

    <!-- [SAI] Badge + Sticky-AI Title -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="76" height="44" rx="10" fill="#ffffff"/>
      <text x="38" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="26" font-weight="900" fill="#090e1d" letter-spacing="-0.6">SAI</text>
      <text x="92" y="35" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">Sticky-AI</text>
    </g>

    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="url(#accent)">Native Google Gemini Desktop &amp; Menu Bar App for macOS</text>

    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="15.5" fill="#cbd5e1">Summon an always-on-top floating Google Gemini assistant over any</text>
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="15.5" fill="#cbd5e1">macOS app, Desktop Space, or fullscreen window in one keystroke.</text>

    <!-- Hotkey Callout -->
    <g transform="translate(0, 228)">
      <rect x="0" y="0" width="114" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="57" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="17" font-weight="700" fill="#f8fafc">⌥ Option</text>

      <text x="128" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#94a3b8">+</text>

      <rect x="150" y="0" width="114" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="207" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="17" font-weight="700" fill="#f8fafc">Space</text>

      <text x="280" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Show • Focus • Hide</text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(0, 294)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#172036" stroke="#2d3c5e"/>
      <text x="80" y="21" text-anchor="middle">⚡ Zero Electron RAM</text>

      <rect x="172" y="0" width="180" height="32" rx="8" fill="#172036" stroke="#2d3c5e"/>
      <text x="262" y="21" text-anchor="middle">🔐 Native Google Sign-In</text>

      <rect x="364" y="0" width="174" height="32" rx="8" fill="#172036" stroke="#2d3c5e"/>
      <text x="451" y="21" text-anchor="middle">🪟 60% Unfocused Glass</text>
    </g>

    <text x="0" y="362" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Open-Source macOS Software by DOMONK Factory • https://domonk.com</text>
  </g>

  <!-- Right Mock macOS Menu Bar [SAI] + Floating Gemini Panel -->
  <g transform="translate(690, 38)" filter="url(#shadow)">
    <!-- macOS Menu Bar Strip Next to Clock -->
    <rect x="0" y="0" width="454" height="30" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="16" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">   Xcode   File   Edit</text>
    <rect x="292" y="5" width="38" height="20" rx="5" fill="#ffffff"/>
    <text x="311" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="900" fill="#090e1d" letter-spacing="-0.4">SAI</text>
    <text x="344" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Mon 9:41 AM</text>

    <!-- Floating Panel -->
    <g transform="translate(26, 44)">
      <rect x="0" y="0" width="414" height="352" rx="16" fill="url(#glass)" stroke="#475569" stroke-width="1.5"/>
      <!-- Titlebar -->
      <circle cx="22" cy="20" r="5.5" fill="#ef4444"/>
      <circle cx="40" cy="20" r="5.5" fill="#f59e0b"/>
      <circle cx="58" cy="20" r="5.5" fill="#22c55e"/>
      <text x="207" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">✦ Google Gemini — Sticky-AI.app</text>
      <line x1="0" y1="38" x2="414" y2="38" stroke="#334155"/>

      <!-- User Bubble -->
      <rect x="126" y="56" width="266" height="42" rx="12" fill="#2563eb"/>
      <text x="142" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#ffffff">Optimize this Swift WKWebView pool</text>

      <!-- Gemini Response Card -->
      <rect x="22" y="114" width="370" height="148" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="38" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#93c5fd">✦ Gemini</text>
      <text x="38" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#cbd5e1">Reuse a shared WKProcessPool and keep a 1pt</text>
      <text x="38" y="184" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#cbd5e1">non-occluded edge so macOS preserves GPU</text>
      <text x="38" y="204" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#cbd5e1">tiles across long idle periods.</text>
      <rect x="38" y="220" width="124" height="22" rx="5" fill="#0f172a"/>
      <text x="100" y="235" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">Instant 0ms wake</text>
      <rect x="172" y="220" width="198" height="22" rx="5" fill="#0f172a"/>
      <text x="271" y="235" text-anchor="middle" font-family="monospace" font-size="11" fill="#c4b5fd">Menu: Opacity • About</text>

      <!-- Auto-Focused Input Box -->
      <rect x="22" y="284" width="370" height="46" rx="23" fill="#0f172a" stroke="#4285F4" stroke-width="1.5"/>
      <text x="44" y="312" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">Ask Google Gemini… |</text>
      <circle cx="366" cy="307" r="14" fill="#4285F4"/>
      <text x="366" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">↑</text>
    </g>
  </g>
</svg>
