<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Sticky-AI — Native Google Gemini Menu Bar &amp; Floating Window App for macOS">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#111833"/>
      <stop offset="100%" stop-color="#181236"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="22" fill="url(#bg)"/>
  <circle cx="980" cy="110" r="190" fill="#4285F4" opacity="0.14"/>
  <circle cx="880" cy="360" r="170" fill="#8b5cf6" opacity="0.14"/>

  <!-- Left Copy Column -->
  <g transform="translate(64, 72)">
    <rect x="0" y="0" width="276" height="32" rx="16" fill="#1e293b" stroke="#334155"/>
    <circle cx="18" cy="16" r="5" fill="#22c55e"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Native Swift macOS 13+ • MIT Open Source</text>

    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Sticky-AI</text>
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="url(#accent)">Google Gemini Everywhere on macOS</text>

    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="16" fill="#cbd5e1">Summon an always-on-top floating Google Gemini assistant</text>
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="16" fill="#cbd5e1">over any app, Space, or fullscreen window in one keystroke.</text>

    <!-- Hotkey Callout -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="112" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="56" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="17" font-weight="700" fill="#f8fafc">⌥ Option</text>

      <text x="126" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#94a3b8">+</text>

      <rect x="148" y="0" width="112" height="44" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="204" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="17" font-weight="700" fill="#f8fafc">Space</text>

      <text x="278" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Show • Focus • Hide</text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(0, 298)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
      <rect x="0" y="0" width="154" height="30" rx="8" fill="#172036" stroke="#2d3c5e"/>
      <text x="77" y="20" text-anchor="middle">⚡ Zero Electron RAM</text>

      <rect x="166" y="0" width="174" height="30" rx="8" fill="#172036" stroke="#2d3c5e"/>
      <text x="253" y="20" text-anchor="middle">🔐 Native Google Login</text>

      <rect x="352" y="0" width="166" height="30" rx="8" fill="#172036" stroke="#2d3c5e"/>
      <text x="435" y="20" text-anchor="middle">🪟 60% Unfocused Glass</text>
    </g>
  </g>

  <!-- Right Mock macOS Floating Gemini Panel -->
  <g transform="translate(710, 44)" filter="url(#shadow)">
    <!-- macOS Menu Bar Strip -->
    <rect x="0" y="0" width="426" height="28" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="16" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">   Code   File   Edit</text>
    <circle cx="344" cy="14" r="5" fill="#4285F4"/>
    <text x="356" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Sticky-AI</text>

    <!-- Floating Panel -->
    <g transform="translate(26, 42)">
      <rect x="0" y="0" width="400" height="330" rx="16" fill="url(#glass)" stroke="#475569" stroke-width="1.5"/>
      <!-- Titlebar -->
      <circle cx="22" cy="20" r="5.5" fill="#ef4444"/>
      <circle cx="40" cy="20" r="5.5" fill="#f59e0b"/>
      <circle cx="58" cy="20" r="5.5" fill="#22c55e"/>
      <text x="200" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">✦ Google Gemini</text>
      <line x1="0" y1="38" x2="400" y2="38" stroke="#334155"/>

      <!-- User Bubble -->
      <rect x="116" y="58" width="262" height="42" rx="12" fill="#2563eb"/>
      <text x="132" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#ffffff">Optimize this Swift WKWebView pool</text>

      <!-- Gemini Response Card -->
      <rect x="22" y="116" width="356" height="132" rx="12" fill="#1e293b" stroke="#334155"/>
      <text x="38" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#93c5fd">✦ Gemini</text>
      <text x="38" y="166" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#cbd5e1">Reuse a shared WKProcessPool and keep a 1pt</text>
      <text x="38" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#cbd5e1">non-occluded edge so macOS preserves GPU</text>
      <text x="38" y="206" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#cbd5e1">tiles across long idle periods.</text>
      <rect x="38" y="218" width="116" height="20" rx="5" fill="#0f172a"/>
      <text x="96" y="232" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">Instant 0ms wake</text>

      <!-- Auto-Focused Input Box -->
      <rect x="22" y="268" width="356" height="44" rx="22" fill="#0f172a" stroke="#4285F4" stroke-width="1.5"/>
      <text x="42" y="295" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">Ask Google Gemini… |</text>
      <circle cx="354" cy="290" r="14" fill="#4285F4"/>
      <text x="354" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">↑</text>
    </g>
  </g>
</svg>
