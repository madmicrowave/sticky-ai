name: Release macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish sai.app
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run automated tests
        run: zsh scripts/run-tests.sh

      - name: Build sai.app
        run: zsh scripts/build-app.sh

      - name: Package sai-macOS.zip
        run: ditto -c -k --sequesterRsrc --keepParent sai.app sai-macOS.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sai-macOS.zip
          generate_release_notes: true
